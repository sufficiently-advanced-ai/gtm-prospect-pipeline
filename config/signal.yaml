# Signal definitions = the LABEL CATALOG. One block per signal; the block KEY is the
# canonical identity (what sequences bind to in config/sequences.yaml) and `name` is the
# canonical stamp written to account.yaml `signal_source` / the CRM `signalSource` value.
# M1 loops over every block with `enabled: true`, in file order.
#
# A block = the label, PLUS optionally an acquisition recipe (a connector + its query).
# LABEL-ONLY BLOCKS ARE VALID: a named block with no query and `enabled: false` is how
# manually-sourced signals (browser research finds, referrals, event lists) enter the
# catalog — add the block, bind a sequence to its key, no code changes.
#
# `aliases:` maps legacy/observed `signal_source` strings in the store and CRM onto the
# block so nothing has to be rewritten in place. Aliases must be unique across blocks and
# must not collide with any block's `name` (validator: node lib/sequence-resolver.ts --validate).
#
# Anything that is JUDGMENT (what a fit looks like, disqualifiers, false-positive classes)
# lives in config/icp.md, not here. This file is queries, gates, and limits.

hiring-signal:
  enabled: true
  name: "Hiring Signal"
  aliases: []
  # --- acquisition recipe: TheirStack job-posting search (blocks without `connector` are TheirStack)
  endpoint: search_companies          # company-level billing (3 credits/company); search_jobs bills per job
  job_description_pattern_or:         # TheirStack regex: (?i), \b, groups, alternation work; avoid lookarounds
    - '(?i)\bREPLACE WITH THE PHRASE YOUR SIGNAL KEYS ON\b'
  job_title_pattern_not: []           # optional: exclude postings whose TITLE matches (e.g. engineering roles)
  company_country_code_or: [US]
  job_country_code_or: [US]
  min_employee_count: 10
  max_employee_count: 500
  posted_at_max_age_days: 30          # STAYS in the payload even with the discovered_at leg below —
                                      # discovered_at_* alone is rejected ("Missing mandatory filter").
                                      # Narrow it before widening: a description pattern regex-scans every
                                      # posting in this window on every call (no index); 90d is ~2.7x the
                                      # text of 30d and where the gateway timeouts live.
  discovered_at_lookback: auto        # ask only for postings the source DISCOVERED since the last billed
                                      # pull of this signal: M1 sets discovered_at_max_age_days from
                                      # `node lib/discovered-window.ts --signal-key <key>` (gap + 2d; null =
                                      # full window when the previous pull returned exactly `limit`, on the
                                      # weekly --sweep, or with no prior pull). Discovery signals only —
                                      # never on a posting-age (merge-mode) signal.
  property_exists_and: [domain]       # a null-domain row bills and cannot be stubbed — server-side, 0 cost
  company_type: direct_employer       # drops agencies/recruiters/staffing shops server-side
  industry_id_not: []                 # TheirStack industry ids to exclude (measure before adding — each
                                      # id should remove many drops and ~zero kept accounts)
  company_description_pattern_not: [] # self-description phrases that mark a company out-of-ICP
  company_keyword_slug_not: []        # job-corpus keyword slugs that mark a company out-of-ICP
  preflight_free_count: true          # 0-credit pool size check before any billed pull
  policy:
    require_salesnav_before_route: false  # true = accounts stop at status:triaged until the browser
                                          # research pass confirms the routing; M3 refuses non-SALES_NAV
    push_to_crm_after: routed             # routed | enrolled — when the CRM first sees this signal's accounts

