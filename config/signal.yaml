# Label-only example: no recipe, never pulled; M2 applies the label by hand from evidence.
# referral:
#   enabled: false
#   name: "Referral"
#   aliases: []

dedupe:
  company_list_id: REPLACE-WITH-THEIRSTACK-LIST-ID   # "Companies seen" list — primary server-side dedupe
  terminal_list_id: null                    # optional second list for merge-mode signals (which never
                                            # exclude the seen-list): TERMINAL accounts only. Create once
                                            # with create_company_list, paste the id, feed it with
                                            # `node lib/list-feed.ts --list terminal --ids` (0 credits),
                                            # snapshot it like the seen-list. null = no terminal leg.
  company_domain_not_cap: 700               # second leg. A payload-size courtesy, NOT a failure boundary:
                                            # per the vendor's request log long legs never failed a search
                                            # (timeouts come from description patterns over the posted_at
                                            # window). Tier overflow on stderr means "feed the lists at 0
                                            # credits" (lib/list-feed.ts), never "raise this number".
  feed_list_after_every_pull: true          # the list does NOT auto-update; also feed it from raw ids on the
                                            # weekly snapshot refresh: `node lib/list-feed.ts --list seen --ids`
  leg_builder: lib/dedupe-leg.ts            # READ-ONLY ranker for the company_domain_not leg
  list_snapshot_dir: raw/theirstack/lists   # <date>-<company_list_id>.json (0 credits); refresh weekly
  merge_verified_window_days: 30            # merge-mode signals: accounts verified inside this window are excluded
  merge_verified_field: verified_at         # the account.yaml date field that window reads
  exclusion_bug_domains: []                 # domains the source keeps returning despite exclusion — drop on sight.
                                            # Known class: the source collapses a SUBDOMAIN you pass (tech.example.com)
                                            # to its registrable root (example.com) before lookup, so the subdomain
                                            # tenant keeps billing and an unrelated root company vanishes. Listing
                                            # the tenant here is what protects the store until the vendor fixes it.

limits:
  credit_guard_min: 60                      # TheirStack credits required per enabled pull signal
  pull_limit_max: 15                        # drop to 8 (then 5) on timeout — a smaller page shortens the response,
                                            # but the timeout itself is the description-pattern scan over the
                                            # posted_at window; fix the window (discovered_at_lookback) first
  cost_per_company_credits: 3
  salesnav_lookups_per_run: 25              # browser research pass: view/search only, human-like pacing; overflow queues
