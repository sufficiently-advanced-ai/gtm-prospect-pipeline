    role: theirstack_company
  - path: inputs/homepage.md
    role: homepage
  - path: inputs/posting.md
    role: jd_text
gold:
  decision: keep
forbidden:
  - field: decision
    value: drop
    reason: >-
      An operating company was dropped as a vendor because its posting used the vocabulary
      of the capability. Wanting to adopt the capability is the signal, not a disqualifier;
      the homepage shows an operator with terminals and a fleet, and nothing for sale but
      freight.
notes: >-
  Synthetic fixture. Every company, person and domain is invented. A keep carries no
  drop_class.
