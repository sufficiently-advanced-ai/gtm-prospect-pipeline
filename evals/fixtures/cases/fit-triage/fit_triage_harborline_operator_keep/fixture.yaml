id: fit_triage_harborline_operator_keep
task: fit-triage
version: 1
description: >-
  A clear keep. A regional freight operator inside the size band, in a non-software
  vertical, hiring a Head of Operations Technology whose posting mentions the capability
  as something the company wants to adopt — not something it sells. The homepage is
  trucks, terminals and a customer portal. Trap: dropping it as a vendor because the
  posting's language is automation-heavy.
provenance:
  domain: harborline-freight.example
  source: "synthetic — shipped with the public repo; replace with your own excerpted decisions"
inputs:
