<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <marker id="fa-gate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-size="13" fill="#5b6470" letter-spacing="1.2">THE FLYWHEEL — EVERY CORRECTION BECOMES A TEST</text>

  <!-- 1 batch judges -->
  <rect x="40" y="80" width="200" height="120" rx="10" fill="#ffffff" stroke="#c9d0d8"/>
  <text x="56" y="106" font-size="12" fill="#8a94a1">1</text>
  <text x="56" y="128" font-size="14" font-weight="600" fill="#1f2933">The batch judges</text>
  <text x="56" y="150" font-size="12" fill="#5b6470">M2 routes, M5 synthesizes</text>
  <text x="56" y="168" font-size="12" fill="#5b6470">every call cites raw captures</text>

  <!-- 2 you correct -->
  <rect x="290" y="80" width="200" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="306" y="106" font-size="12" fill="#b45309">2</text>
  <text x="306" y="128" font-size="14" font-weight="600" fill="#1f2933">You correct a call</text>
  <text x="306" y="150" font-size="12" fill="#5b6470">dashboard button or CLI</text>
  <text x="306" y="168" font-size="12" fill="#5b6470">ruling stored verbatim, by id</text>

  <!-- 3 ruling executed + listed -->
  <rect x="540" y="80" width="200" height="120" rx="10" fill="#ffffff" stroke="#c9d0d8"/>
  <text x="556" y="106" font-size="12" fill="#8a94a1">3</text>
  <text x="556" y="128" font-size="14" font-weight="600" fill="#1f2933">Next run applies it</text>
  <text x="556" y="150" font-size="12" fill="#5b6470">account flips to your ruling</text>
  <text x="556" y="168" font-size="12" fill="#5b6470">and lands in the fixture backlog</text>

  <!-- 4 fixture drafted -->
  <rect x="790" y="80" width="200" height="120" rx="10" fill="#ffffff" stroke="#c9d0d8"/>
  <text x="806" y="106" font-size="12" fill="#8a94a1">4</text>
  <text x="806" y="128" font-size="14" font-weight="600" fill="#1f2933">Fixture drafted</text>
  <text x="806" y="150" font-size="12" fill="#5b6470">inputs excerpted from raw/</text>
  <text x="806" y="168" font-size="12" fill="#5b6470">gold from the corrected account</text>

  <g stroke="#5b6470" stroke-width="1.6" marker-end="url(#fa)">
    <line x1="240" y1="140" x2="288" y2="140"/>
    <line x1="490" y1="140" x2="538" y2="140"/>
    <line x1="740" y1="140" x2="788" y2="140"/>
  </g>

  <!-- 5 you name the trap -->
  <rect x="790" y="260" width="200" height="120" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="806" y="286" font-size="12" fill="#b45309">5</text>
  <text x="806" y="308" font-size="14" font-weight="600" fill="#1f2933">You name the trap</text>
  <text x="806" y="330" font-size="12" fill="#5b6470">confirm the gold, write down</text>
  <text x="806" y="348" font-size="12" fill="#5b6470">the wrong answer that happened</text>
  <line x1="890" y1="200" x2="890" y2="258" stroke="#5b6470" stroke-width="1.6" marker-end="url(#fa)"/>

  <!-- 6 gate -->
  <rect x="290" y="260" width="450" height="120" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.6"/>
  <text x="306" y="286" font-size="12" fill="#15803d">6</text>
  <text x="306" y="308" font-size="14" font-weight="600" fill="#1f2933">Every future edit is gated</text>
  <text x="306" y="330" font-size="12" fill="#3b4652">check-evals.sh runs before any change to a skill or the ICP lands.</text>
  <text x="306" y="348" font-size="12" fill="#3b4652">A wording change that would re-make the corrected mistake</text>
  <text x="306" y="366" font-size="12" fill="#3b4652">fails on that fixture. $0, no model call.</text>
  <line x1="788" y1="320" x2="742" y2="320" stroke="#5b6470" stroke-width="1.6" marker-end="url(#fa)"/>

  <!-- back to 1 -->
  <path d="M 290 320 L 140 320 L 140 202" fill="none" stroke="#15803d" stroke-width="1.8" marker-end="url(#fa-gate)"/>
  <text x="152" y="276" font-size="12" fill="#15803d">the lesson holds</text>
  <text x="152" y="294" font-size="12" fill="#15803d">on every later batch</text>

  <!-- footer -->
  <rect x="40" y="420" width="1120" height="64" rx="10" fill="#f4f6f8" stroke="#dfe3e8"/>
  <text x="60" y="446" font-size="13" fill="#1f2933" font-weight="600">Where it shows up</text>
  <text x="60" y="468" font-size="12" fill="#5b6470">dashboard tile "eval fixture backlog" · run-start count · M7 drafts the backlog at the end of every batch · config/icp.md rulings log points at the fixture id</text>
</svg>
